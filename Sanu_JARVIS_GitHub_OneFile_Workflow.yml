name: Build Sanu JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create Android project
        run: |
          python3 - <<'PYCODE'
          import base64, os
          files = {}
          files['gradle.properties'] = 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg=='
          files['build.gradle'] = 'cGx1Z2lucyB7IGlkICdjb20uYW5kcm9pZC5hcHBsaWNhdGlvbicgdmVyc2lvbiAnOC42LjEnIGFwcGx5IGZhbHNlIH0K'
          files['settings.gradle'] = ''
          files['app/build.gradle'] = ''
          files['app/src/main/AndroidManifest.xml'] = ''
          files['app/src/main/java/com/sanu/jarvis/MainActivity.java'] = ''
          files['app/src/main/res/layout/activity_main.xml'] = ''
          files['app/src/main/res/values/colors.xml'] = 'PHJlc291cmNlcz48Y29sb3IgbmFtZT0iYmciPiMwNTA3MEQ8L2NvbG9yPjxjb2xvciBuYW1lPSJjeWFuIj4jMDBFNUZGPC9jb2xvcj48Y29sb3IgbmFtZT0id2hpdGUiPiNGNUY3RkE8L2NvbG9yPjxjb2xvciBuYW1lPSJtdXRlZCI+IzhFOUFBRjwvY29sb3I+PC9yZXNvdXJjZXM+Cg=='
          files['app/src/main/res/values/styles.xml'] = ''
          for path, data in files.items():
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              with open(path, 'wb') as f:
                  f.write(base64.b64decode(data))
          PYCODE
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sanu-JARVIS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
